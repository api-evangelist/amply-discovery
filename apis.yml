name: AMPLY Discovery
description: >-
  AMPLY Discovery is a UK (Belfast, Northern Ireland) biotechnology company
  turning the roughly 98% of the genome largely ignored by drug developers —
  the "dark genome" — into a pipeline of first-in-class therapeutics. The
  company pairs six AI/computational discovery engines with two wet labs in a
  closed loop between silicon and bench to find novel antimicrobial and
  therapeutic candidates targeting drug-resistant pathogens and complex
  diseases. AMPLY is a Techstars portfolio company and has been backed by
  Innovate UK, Invest NI, QUBIS and other UK/NI innovation programmes. It is
  tracked in the API Evangelist network as a company profile; AMPLY Discovery
  publishes no public developer API, documentation, SDKs, or machine-readable
  API surface at this time.
